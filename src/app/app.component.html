<div class="app-header">
  <div class="brand">
    <button type="button" class="brand-logo-button" (click)="toggleLogoPreview()" aria-label="Show full ArcLord logo">
      <img class="brand-logo" src="assets/images/logo.jpeg" alt="ArcLord logo">
    </button>
    <a class="brand-copy" routerLink="/">
      <div class="brand-title"><span class="brand-arc">Arc</span><span class="brand-lord">Lord</span></div>
      <div class="brand-tagline">Ascend beyond ordinary, conquer new limits</div>
    </a>
  </div>
</div>

<div class="logo-overlay" *ngIf="showLogoPreview" (click)="closeLogoPreview()">
  <div class="overlay-backdrop"></div>
  <div class="overlay-content" (click)="$event.stopPropagation()">
    <button class="close-btn" type="button" aria-label="Close logo preview" (click)="closeLogoPreview()">×</button>
    <img src="assets/images/logo.jpeg" alt="Full ArcLord logo">
  </div>
</div>

<!-- When logged in: leftnav owns the router-outlet -->
<div *ngIf="showMainShell" class="app-shell">
  <app-leftnav></app-leftnav>
</div>

<!-- Login / Unauthorized only -->
<main *ngIf="!showMainShell" class="app-main">
  <router-outlet></router-outlet>
</main>

<app-toast></app-toast>

<!-- Arc AI shelf — fixed position, always on top, shown when logged in -->
<app-ai-shelf *ngIf="showMainShell"></app-ai-shelf>
