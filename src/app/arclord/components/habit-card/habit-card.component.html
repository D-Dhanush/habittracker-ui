<div
  *ngIf="habit as h"
  class="habit-card"
  [style.--primary-color]="h.primaryColor"
  [style.--secondary-color]="h.secondaryColor">

  <div class="card-content" (click)="onCardClick()">

    <!-- Header -->
    <div class="card-header">
      <div class="icon-wrapper">
        <span class="habit-icon">
          {{ getIconSymbol(h.primaryIcon) }}
        </span>
      </div>

      <div class="header-info">
        <h3 class="habit-name">{{ h.name }}</h3>

        <p
          class="habit-subtitle"
          *ngIf="h.subtitle">
          {{ h.subtitle }}
        </p>
      </div>
    </div>

    <!-- Category & Status -->
    <div class="card-meta">
      <span class="badge badge-gold">
        {{ getCategoryLabel() }}
      </span>

      <span class="badge">
        {{ getStatusLabel() }}
      </span>
    </div>

    <!-- Stats Grid -->
    <div class="stats-grid">

      <div class="stat-item">
        <span class="stat-label">Streak</span>
        <span class="stat-value text-gold">
          {{ streak }}
        </span>
      </div>

      <div class="stat-item">
        <span class="stat-label">Completion</span>
        <span class="stat-value text-blue">
          {{ completionPercentage }}%
        </span>
      </div>

      <div class="stat-item">
        <span class="stat-label">XP Reward</span>
        <span class="stat-value text-gold">
          +{{ h.xpReward ?? 0 }}
        </span>
      </div>

    </div>

    <!-- Progress -->
    <div class="progress-container">
      <div class="progress-bar">
        <div
          class="progress-fill"
          [style.width.%]="completionPercentage">
        </div>
      </div>
    </div>

    <!-- Frequency -->
    <div class="frequency-badge">
      <span>⏰</span>
      <span>
        {{ h.frequency | uppercase }}
      </span>
    </div>

    <div class="shine-effect"></div>

  </div>
</div>
