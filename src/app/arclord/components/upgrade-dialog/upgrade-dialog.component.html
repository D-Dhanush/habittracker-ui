<div class="dialog-backdrop" (click)="maybeLater()">
  <div class="dialog-card" (click)="$event.stopPropagation()">
    <div class="dialog-icon">🔒</div>
    <h2>Unlock ArcLord Premium</h2>
    <p>{{ message }}</p>

    <div class="dialog-actions">
      <button class="btn-primary" (click)="upgradeNow()">Upgrade Now</button>
      <button class="btn-text" (click)="maybeLater()">Maybe Later</button>
    </div>
  </div>
</div>
