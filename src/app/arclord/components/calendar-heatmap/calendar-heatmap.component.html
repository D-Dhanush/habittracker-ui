<div class="calendar-heatmap">
  <div class="calendar-header">
    <h3>{{ calendarData.month }} {{ calendarData.year }}</h3>
  </div>

  <div class="calendar-container">
    <!-- Day labels -->
    <div class="day-labels">
      <div class="day-label" *ngFor="let label of dayLabels">{{ label }}</div>
    </div>

    <!-- Calendar cells -->
    <div class="calendar-grid">
      <div 
        *ngFor="let week of calendarData.weeks"
        class="calendar-week">
        <div 
          *ngFor="let day of week.days"
          class="day-cell"
          [ngClass]="getCellClass(day)"
          [title]="getDayDateString(day) + ' - ' + getStatusText(day)">
          <span *ngIf="!day.empty" class="day-number">{{ day.date.getDate() }}</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Legend -->
  <div class="calendar-legend">
    <div class="legend-item">
      <span class="legend-cell completed"></span>
      <span class="legend-label">Completed</span>
    </div>
    <div class="legend-item">
      <span class="legend-cell streak"></span>
      <span class="legend-label">Streak</span>
    </div>
    <div class="legend-item">
      <span class="legend-cell pending"></span>
      <span class="legend-label">Pending</span>
    </div>
  </div>
</div>
