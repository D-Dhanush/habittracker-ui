<div class="habits-page">
  <!-- Page Header -->
  <section class="page-header">
    <div class="header-content">
      <div>
        <h1>Habits</h1>
        <p>Master your daily habits and unlock your full potential</p>
      </div>
      <button mat-flat-button class="btn-primary" (click)="onCreateHabit()">
        <mat-icon>add</mat-icon>
        Create Habit
      </button>
    </div>
  </section>

  <!-- Filter Bar -->
  <section class="filter-bar">
    <div class="filter-buttons">
      <button 
        class="filter-btn" 
        [class.active]="filteredStatus === 'all'"
        (click)="setFilter('all')">
        All Habits ({{ getTotalCount() }})
      </button>
      <button 
        class="filter-btn" 
        [class.active]="filteredStatus === 'active'"
        (click)="setFilter('active')">
        <mat-icon>play_circle</mat-icon>
        Active
      </button>
      <button 
        class="filter-btn" 
        [class.active]="filteredStatus === 'paused'"
        (click)="setFilter('paused')">
        <mat-icon>pause_circle</mat-icon>
        Paused
      </button>
      <button 
        class="filter-btn" 
        [class.active]="filteredStatus === 'completed'"
        (click)="setFilter('completed')">
        <mat-icon>check_circle</mat-icon>
        Completed
      </button>
    </div>
    <span class="result-count">Showing {{ getDisplayedCount() }} of {{ getTotalCount() }} habits</span>
  </section>

  <!-- Habits Grid -->
  <section class="habits-grid" *ngIf="displayedHabits.length > 0">
    <app-habit-card 
      *ngFor="let habit of displayedHabits"
      [habit]="habit"
      (habitClick)="onHabitClick($event)">
    </app-habit-card>
  </section>

  <!-- Empty State -->
  <section class="empty-state" *ngIf="displayedHabits.length === 0">
    <mat-icon>sentiment_very_satisfied</mat-icon>
    <h2>No habits found</h2>
    <p>{{ filteredStatus === 'all' ? 'Start creating your first habit to get started!' : 'No habits in this category yet.' }}</p>
    <button mat-flat-button class="btn-primary" (click)="onCreateHabit()" *ngIf="filteredStatus === 'all'">
      <mat-icon>add</mat-icon>
      Create Your First Habit
    </button>
  </section>
</div>
